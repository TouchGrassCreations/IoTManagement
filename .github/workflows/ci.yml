name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run it interrupted; only the tip needs a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:unit

      - run: npm run build

  image:
    name: Build and run the container
    runs-on: ubuntu-latest
    # Independent of `verify`: a broken image should be distinguishable from a
    # failing test at a glance, and neither needs to wait for the other.
    timeout-minutes: 20
    env:
      SECRET: a-confirmation-secret-for-ci
      TRUSTED_PROXY_SECRET: a-proxy-secret-for-ci
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: parts-cabinet:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves nothing about booting: the image that could not find
      # `react` built cleanly and died on its first line of JavaScript.
      - name: It boots and serves
        run: |
          docker run -d --name cabinet -p 3000:3000 \
            -e CONFIRMATION_TOKEN_SECRET="$SECRET" \
            -e ANONYMOUS_OWNER_ID=continuous-integration \
            -v cabinet-data:/data \
            parts-cabinet:ci
          .github/scripts/wait-for-cabinet.sh || { docker logs cabinet; exit 1; }

      - name: The healthcheck agrees
        run: |
          for _ in $(seq 1 24); do
            status=$(docker inspect --format '{{.State.Health.Status}}' cabinet)
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && { docker logs cabinet; exit 1; }
            sleep 5
          done
          echo "the healthcheck never reported healthy"; docker logs cabinet; exit 1

      - name: A write reaches the database on the volume
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/projects \
            -H 'content-type: application/json' \
            -d '{"name":"Continuous integration","description":"","parts":[]}')
          [ "$code" = 201 ] || { echo "expected 201, got $code"; docker logs cabinet; exit 1; }
          docker logs cabinet 2>&1 | grep -q 'applied .* migration' \
            || { echo "the first query should have migrated an empty volume"; docker logs cabinet; exit 1; }

      # The realistic failure is a redeploy, not a restart: a new container
      # meeting a volume that already has the schema. Unjournalled, the bare
      # CREATE TABLE in migration 0000 takes it down on the first request.
      - name: A replacement container keeps the data and re-runs no migrations
        run: |
          docker rm -f cabinet
          docker run -d --name cabinet -p 3000:3000 \
            -e CONFIRMATION_TOKEN_SECRET="$SECRET" \
            -e ANONYMOUS_OWNER_ID=continuous-integration \
            -v cabinet-data:/data \
            parts-cabinet:ci
          .github/scripts/wait-for-cabinet.sh || { docker logs cabinet; exit 1; }
          curl -fsS http://localhost:3000/api/projects | grep -q 'Continuous integration' \
            || { echo "the project did not survive the replacement"; docker logs cabinet; exit 1; }
          docker logs cabinet 2>&1 | grep -q 'applied .* migration' \
            && { echo "migrations ran twice against the same volume"; docker logs cabinet; exit 1; }
          exit 0

      # The deployment's trust boundary: the proxy strips what a client claims
      # and the app refuses identity that did not come through the proxy.
      # Neither half is any use alone, so both are exercised together.
      - name: A visitor cannot become somebody else
        run: |
          docker rm -f cabinet
          docker volume rm -f cabinet-data
          docker run -d --name cabinet -p 3000:3000 \
            -e CONFIRMATION_TOKEN_SECRET="$SECRET" \
            -e TRUSTED_PROXY_SECRET \
            -v cabinet-data:/data \
            parts-cabinet:ci
          .github/scripts/wait-for-cabinet.sh || { docker logs cabinet; exit 1; }

          node .github/scripts/stub-identity-provider.mjs &
          echo $! > /tmp/stub.pid

          docker run -d --name caddy --network host \
            -e CABINET_DOMAIN=http://localhost:8080 \
            -e ACME_EMAIL=ci@example.test \
            -e TRUSTED_PROXY_SECRET \
            -e OAUTH_UPSTREAM=127.0.0.1:4180 \
            -e CABINET_UPSTREAM=127.0.0.1:3000 \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --entrypoint caddy caddy:2-alpine \
            run --config /etc/caddy/Caddyfile --adapter caddyfile
          .github/scripts/wait-for-cabinet.sh http://localhost:8080/ || { docker logs caddy; exit 1; }

          .github/scripts/check-proxy-identity.sh || { docker logs caddy; docker logs cabinet; exit 1; }
          kill "$(cat /tmp/stub.pid)" 2>/dev/null || true

      - name: The compose file is valid, and refuses to start without a secret
        env:
          CABINET_DOMAIN: cabinet.example
          ACME_EMAIL: ci@example.test
          OAUTH_CLIENT_ID: client-id
          OAUTH_CLIENT_SECRET: client-secret
          OAUTH_COOKIE_SECRET: cookie-secret
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e CABINET_DOMAIN -e ACME_EMAIL -e TRUSTED_PROXY_SECRET \
            --entrypoint caddy caddy:2-alpine \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile

          CONFIRMATION_TOKEN_SECRET="$SECRET" docker compose config --quiet
          if docker compose config --quiet 2>/dev/null; then
            echo "compose should refuse an unset CONFIRMATION_TOKEN_SECRET"; exit 1
          fi

      - name: Container logs
        if: failure()
        run: |
          docker logs cabinet 2>&1 || true
          docker logs caddy 2>&1 || true
